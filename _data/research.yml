# Research browser on the homepage.
# Each paper lists one or more theme keys; the filter buttons are built from `themes`.
# Papers show newest first in the order written here. Images live in assets/img/.
# Names in lab_authors are bolded in author lists here and on the publications page
# (spelled as in papers.bib).

lab_authors: ["Kenneth Marino", "Md Farhan Ishmam", "Priya Gurjar", "Dai-Jie Wu", "Minh Pham-Dinh"]

themes:
  - key: computer-use
    name: Computer use
    icon: fas fa-laptop
    question: How can artificial agents navigate the open web and use computers with the fluidity of a human user?
  - key: embodied
    name: Embodied multimodal agents
    icon: fas fa-robot
    question: How can agents that see, act, and remember be deployed in real-world settings, from simulation to robots?
  - key: nlp
    name: NLP
    icon: fas fa-language
    question: How can language models reason, explore, and help with expert work, from science to law?

